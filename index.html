<!doctype html>
<html lang="en" class="no-js">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>trygrowency: Growency</title>
    <meta name="description" content="Growency builds growth campaigns: strategy, creative and performance, under one roof." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <!-- First visible campaign posters load first -->
    <link rel="preload" href="/media/campaigns/placeholder-01.jpg" as="image" fetchpriority="high" />
    <link rel="preload" href="/media/campaigns/placeholder-02.jpg" as="image" />
    <link rel="preload" href="/media/campaigns/placeholder-18.jpg" as="image" />
    <script>
      document.documentElement.classList.replace('no-js', 'js');
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <header class="site-nav" data-nav>
      <a class="site-nav__brand" href="/" aria-label="Growency home">
        <svg class="site-nav__mark" data-mark-icon aria-hidden="true" focusable="false"></svg>
        <span class="site-nav__name">growency</span>
      </a>
    </header>

    <main id="main-content" tabindex="-1">
      <section class="hero" id="hero" aria-labelledby="hero-title" data-hero>
        <div class="hero__stage" data-hero-stage>
          <h1 class="hero__wordmark" id="hero-title" data-wordmark>
            <span class="visually-hidden">trygrowency</span>
            <!--WORDMARK-->
          </h1>
          <p class="visually-hidden">The only growth agency you’ll ever need. Strategy, creative and performance.</p>

          <canvas
            class="hero__canvas"
            data-hero-canvas
            role="img"
            aria-label="A ring of Growency campaign work that assembles into the Growency mark as you scroll."
          ></canvas>

          <!-- Hover / focus / tap target for the metallic mark -->
          <button class="hero__mark-hit" type="button" data-mark-hit aria-pressed="false" tabindex="-1">
            <span class="visually-hidden">Growency mark: press to highlight, drag or use arrow keys to rotate</span>
          </button>

          <!-- Static layout: reduced motion, no WebGL, or no JS -->
          <div class="hero__static" data-hero-static>
            <svg class="hero__static-mark" data-static-mark role="img" aria-label="The Growency mark, filled with campaign work"></svg>
          </div>

          <p class="hero__hint" data-hero-hint aria-hidden="true">
            <span class="hero__hint-drag">Drag to explore</span>
            <span class="hero__hint-scroll">Scroll</span>
          </p>
        </div>
      </section>

    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
